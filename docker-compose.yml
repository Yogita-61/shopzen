services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shopzen
      POSTGRES_PASSWORD: shopzen
      POSTGRES_DB: shopzen
    ports: ["5432:5432"]
    volumes: ["shopzen_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopzen -d shopzen"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["shopzen_redis:/data"]
volumes:
  shopzen_pg:
  shopzen_redis:
